name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.4)"
        required: true

env:
  REGISTRY: ghcr.io
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/hub
  FARM_IMAGE: ghcr.io/${{ github.repository_owner }}/farm

jobs:
  changelog:
    name: Create release with changelog
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release only a tag on main
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Generate release notes (current tag only)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: CHANGES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Build & push Docker images
    needs: changelog
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout hub repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned clients release
        id: clients-ref
        run: echo "ref=$(tr -d '[:space:]' < clients.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wavvon-clients (for web client build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wavvon/Wavvon-clients
          ref: ${{ steps.clients-ref.outputs.ref }}
          path: web-client-src
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ---- hub image ----

      - name: Extract hub metadata
        id: hub-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: crates/hub/Dockerfile
          push: true
          tags: ${{ steps.hub-meta.outputs.tags }}
          labels: ${{ steps.hub-meta.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

      # ---- farm image ----

      - name: Extract farm metadata
        id: farm-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.FARM_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push farm
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: crates/farm/Dockerfile
          push: true
          tags: ${{ steps.farm-meta.outputs.tags }}
          labels: ${{ steps.farm-meta.outputs.labels }}
          cache-from: type=gha,scope=farm
          cache-to: type=gha,mode=max,scope=farm

  binaries:
    name: Build Linux binaries
    needs: changelog
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + musl targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Install musl tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      - name: Install Zig + cargo-zigbuild (aarch64 musl cross-compiler)
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build hub (x86_64 musl)
        run: cargo build --release -p wavvon-hub --target x86_64-unknown-linux-musl

      - name: Build farm (x86_64 musl)
        run: cargo build --release -p wavvon-farm --target x86_64-unknown-linux-musl

      - name: Build hub (aarch64 musl)
        run: cargo zigbuild --release -p wavvon-hub --target aarch64-unknown-linux-musl

      - name: Build hub (x86_64 glibc)
        run: cargo build --release -p wavvon-hub --target x86_64-unknown-linux-gnu

      - name: Rename artifacts
        run: |
          cp target/x86_64-unknown-linux-musl/release/wavvon-hub  wavvon-hub-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/wavvon-farm wavvon-farm-linux-x86_64
          cp target/aarch64-unknown-linux-musl/release/wavvon-hub wavvon-hub-linux-aarch64
          cp target/x86_64-unknown-linux-gnu/release/wavvon-hub   wavvon-hub-linux-x86_64-glibc

      - name: Sign binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.pem"
          for f in wavvon-hub-linux-x86_64 wavvon-farm-linux-x86_64 wavvon-hub-linux-aarch64 wavvon-hub-linux-x86_64-glibc; do
            { printf 'wavvon/release-asset/v1\0%s\0' "$f"; cat "$f"; } > "$RUNNER_TEMP/msg"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.pem" -rawin -in "$RUNNER_TEMP/msg" -out "$f.sig"
            test "$(stat -c %s "$f.sig")" = 64
          done
          rm -f "$RUNNER_TEMP/release.pem" "$RUNNER_TEMP/msg"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            wavvon-hub-linux-x86_64
            wavvon-hub-linux-x86_64.sig
            wavvon-farm-linux-x86_64
            wavvon-farm-linux-x86_64.sig
            wavvon-hub-linux-aarch64
            wavvon-hub-linux-aarch64.sig
            wavvon-hub-linux-x86_64-glibc
            wavvon-hub-linux-x86_64-glibc.sig
            crates/identity/wire-vectors.json

  identity-package:
    name: Package wavvon-identity
    needs: changelog
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.published.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Is this version on crates.io already?
        id: published
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/identity/Cargo.toml | head -1)
          test -n "$version"
          if curl -fsS -A "Wavvon-server release (https://github.com/Wavvon/Wavvon-server)" "https://crates.io/api/v1/crates/wavvon-identity/$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.published.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Package and verify
        if: steps.published.outputs.exists == 'false'
        run: cargo package -p wavvon-identity

  identity-crate:
    name: Publish wavvon-identity to crates.io
    needs: identity-package
    if: needs.identity-package.outputs.exists == 'false'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9

      - name: Publish
        run: cargo publish -p wavvon-identity --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
